<p-toast
  position="top-right"
  [breakpoints]="{
    '920px': { width: '100%', right: '0', left: '0', top: '64px' },
  }"
></p-toast>

<div class="min-h-screen bg-neutral-50 dark:bg-black">
  <div
    class="sticky top-0 z-30 bg-white/80 dark:bg-black/80 backdrop-blur-xl border-b border-neutral-100 dark:border-neutral-900"
  >
    <div
      class="max-w-3xl mx-auto px-5 sm:px-8 py-4 flex items-center justify-center"
    >
      <span
        class="text-sm font-semibold text-black dark:text-white tracking-tight"
      >
        Ventas de otro local
      </span>
      <div class="w-14"></div>
    </div>
  </div>

  <div class="max-w-3xl mx-auto px-5 sm:px-8 py-10 flex flex-col gap-10">
    <div class="flex flex-col gap-2 vol-fade" style="--d: 0s">
      <div class="flex items-center gap-3">
        <span class="w-5 h-px bg-yellow-500"></span>
        <span
          class="text-[10px] uppercase tracking-[0.3em] font-semibold text-neutral-400 dark:text-neutral-500"
        >
          Registro
        </span>
      </div>
      <h1
        class="text-3xl sm:text-4xl font-bold text-black dark:text-white leading-tight tracking-tight"
      >
        Nueva venta
      </h1>
      <p class="text-sm text-neutral-400 dark:text-neutral-500">
        Registra una venta realizada desde otro local
      </p>
    </div>

    <form
      (ngSubmit)="registrarVenta()"
      class="flex flex-col gap-8 vol-fade"
      style="--d: 0.07s"
    >
      <div class="flex flex-col gap-1.5">
        <p
          class="text-[10px] uppercase tracking-[0.25em] font-semibold text-neutral-400 dark:text-neutral-500"
        >
          Producto
        </p>
        <div
          class="bg-white dark:bg-neutral-900 rounded-[20px] border border-neutral-200/60 dark:border-neutral-800/60 overflow-hidden divide-y divide-neutral-100 dark:divide-neutral-800/60"
        >
          <div class="vol-field flex items-center gap-4 px-5 py-4">
            <label
              class="w-28 shrink-0 text-xs font-semibold text-neutral-500 dark:text-neutral-400"
            >
              Marca
            </label>
            <input
              id="marca"
              type="text"
              placeholder="Ej: Nike"
              [(ngModel)]="nuevaVenta.marca"
              name="marca"
              class="vol-input flex-1"
            />
          </div>

          <div class="vol-field flex items-center gap-4 px-5 py-4">
            <label
              class="w-28 shrink-0 text-xs font-semibold text-neutral-500 dark:text-neutral-400"
            >
              Referencia
            </label>
            <input
              id="referencia"
              type="text"
              placeholder="Ej: Air Max 270"
              [(ngModel)]="nuevaVenta.referencia"
              name="referencia"
              class="vol-input flex-1"
            />
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <p
          class="text-[10px] uppercase tracking-[0.25em] font-semibold text-neutral-400 dark:text-neutral-500"
        >
          Precios
        </p>
        <div
          class="bg-white dark:bg-neutral-900 rounded-[20px] border border-neutral-200/60 dark:border-neutral-800/60 overflow-hidden divide-y divide-neutral-100 dark:divide-neutral-800/60"
        >
          <div class="vol-field flex items-center gap-4 px-5 py-3.5">
            <label
              class="w-28 shrink-0 text-xs font-semibold text-neutral-500 dark:text-neutral-400"
            >
              Compra
            </label>
            <p-inputnumber
              inputId="precioCompra"
              name="precioCompra"
              [(ngModel)]="nuevaVenta.precioCompra"
              placeholder="0"
              styleClass="vol-pnumber"
            ></p-inputnumber>
          </div>

          <div class="vol-field flex items-center gap-4 px-5 py-3.5">
            <label
              class="w-28 shrink-0 text-xs font-semibold text-neutral-500 dark:text-neutral-400"
            >
              Venta
            </label>
            <p-inputnumber
              inputId="precioVenta"
              name="precioVenta"
              [(ngModel)]="nuevaVenta.precioVenta"
              placeholder="0"
              styleClass="vol-pnumber"
            ></p-inputnumber>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <p
          class="text-[10px] uppercase tracking-[0.25em] font-semibold text-neutral-400 dark:text-neutral-500"
        >
          Método de pago
        </p>
        <div
          class="bg-white dark:bg-neutral-900 rounded-[20px] border border-neutral-200/60 dark:border-neutral-800/60 px-5 py-4"
        >
          <p-select
            inputId="metodoPago"
            [options]="metodosPago"
            optionLabel="nombre"
            placeholder="Selecciona un método…"
            [(ngModel)]="nuevaVenta.metodoPago"
            name="metodoPago"
            styleClass="vol-select w-full"
          ></p-select>
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button
          type="button"
          [disabled]="cargando"
          (click)="limpiarFormulario()"
          class="flex-1 py-3.5 rounded-full text-sm font-semibold bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300 hover:bg-neutral-200 dark:hover:bg-neutral-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-150 active:scale-[0.98] cursor-pointer"
        >
          Limpiar
        </button>

        <button
          type="submit"
          [disabled]="cargando"
          class="flex-[2] py-3.5 rounded-full text-sm font-semibold bg-black dark:bg-white text-white dark:text-black hover:opacity-80 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-150 inline-flex items-center justify-center gap-2 cursor-pointer"
        >
          <i
            class="pi text-xs"
            [ngClass]="{
              'pi-check': !cargando,
              'pi-spin pi-spinner': cargando,
            }"
          ></i>
          {{ cargando ? "Procesando…" : "Registrar venta" }}
        </button>
      </div>
    </form>
  </div>
</div>
