<div class="w-full flex flex-col gap-8 px-4 py-8">
  <div class="flex flex-col gap-2 tp-fade" style="--d: 0s">
    <div class="flex items-center gap-3">
      <span class="w-5 h-px bg-yellow-500"></span>
      <span
        class="text-[10px] uppercase tracking-[0.3em] font-semibold text-neutral-400 dark:text-neutral-500"
      >
        Rendimiento
      </span>
    </div>
    <h2
      class="text-2xl font-bold text-black dark:text-white leading-tight tracking-tight"
    >
      Top productos
    </h2>
    <p class="text-sm text-neutral-400 dark:text-neutral-500">
      Los 3 más vendidos según rendimiento global
    </p>
  </div>

  <div class="flex flex-col gap-3">
    <ng-template #skeletonLoader>
      <div
        *ngFor="let n of [1, 2, 3]; let i = index"
        class="tp-fade flex items-center gap-4 p-4 rounded-[20px] bg-neutral-100 dark:bg-neutral-900/60 animate-pulse"
        [style]="'--d:' + i * 0.08 + 's'"
      >
        <div
          class="w-16 h-16 rounded-[14px] bg-neutral-200 dark:bg-neutral-800 shrink-0"
        ></div>
        <div class="flex-1 flex flex-col gap-2">
          <div
            class="h-4 w-2/3 bg-neutral-200 dark:bg-neutral-800 rounded-full"
          ></div>
          <div
            class="h-3 w-1/3 bg-neutral-200/70 dark:bg-neutral-800/70 rounded-full"
          ></div>
          <div
            class="h-4 w-1/4 bg-yellow-200/60 dark:bg-yellow-900/40 rounded-full mt-1"
          ></div>
        </div>
        <div
          class="w-8 h-8 rounded-full bg-neutral-200 dark:bg-neutral-800 shrink-0"
        ></div>
      </div>
    </ng-template>

    <ng-container *ngIf="topProductos?.length; else skeletonLoader">
      <div
        *ngFor="let producto of topProductos; let i = index"
        class="tp-fade tp-row group flex items-center gap-4 bg-white dark:bg-neutral-900 rounded-[20px] p-4 border border-neutral-100/80 dark:border-neutral-800/60 hover:border-neutral-200 dark:hover:border-neutral-700 transition-all duration-200 cursor-default"
        [style]="'--d:' + (i * 0.08 + 0.05) + 's'"
      >
        <div
          class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold"
          [ngClass]="{
            'bg-yellow-500 text-black': i === 0,
            'bg-neutral-200 dark:bg-neutral-700 text-neutral-600 dark:text-neutral-300':
              i === 1,
            'bg-neutral-100 dark:bg-neutral-800 text-neutral-500 dark:text-neutral-400':
              i === 2,
          }"
        >
          {{ i + 1 }}
        </div>

        <div
          class="shrink-0 w-14 h-14 rounded-[14px] overflow-hidden bg-neutral-100 dark:bg-neutral-800 border border-neutral-200/60 dark:border-neutral-700/40"
        >
          <img
            [src]="producto.imagen"
            [alt]="producto.referencia"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
            loading="lazy"
          />
        </div>

        <div class="flex-1 min-w-0">
          <p
            class="text-sm font-semibold text-black dark:text-white truncate leading-tight"
          >
            {{ producto.marca }} {{ producto.referencia }}
          </p>
          <div class="flex items-center gap-2 mt-1 flex-wrap">
            <span class="text-xs text-neutral-500 dark:text-neutral-400">
              {{ producto.unidadesVendidas }} uds.
            </span>
            <span
              class="w-1 h-1 rounded-full bg-neutral-300 dark:bg-neutral-600 shrink-0"
            ></span>
            <span
              class="text-xs font-semibold text-yellow-600 dark:text-yellow-500"
            >
              {{ producto.totalAcumulado | number: "1.0-0" }}
            </span>
          </div>
        </div>

        <div class="shrink-0 flex flex-col items-end gap-1.5">
          <span
            class="text-[10px] font-semibold bg-yellow-50 dark:bg-yellow-500/10 text-yellow-700 dark:text-yellow-500 px-2 py-0.5 rounded-full"
          >
            Tendencia
          </span>
          <span
            class="text-[10px] font-semibold bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-500 px-2 py-0.5 rounded-full"
          >
            Top seller
          </span>
        </div>
      </div>
    </ng-container>
  </div>
</div>
