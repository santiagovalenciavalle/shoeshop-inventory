<div
  class="flex items-center justify-between p-3 border-b-2 border-yellow-500 shadow-sm bg-white dark:bg-black transition-colors duration-300"
  style="position: fixed; width: 100%; z-index: 10; top: 5.5rem"
>
  <button
    *ngIf="menuItems.length"
    (click)="abrirSidenar()"
    class="flex items-center justify-center p-2 rounded-full bg-yellow-500 text-white hover:bg-yellow-600 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:ring-offset-2 dark:focus:ring-offset-black"
  >
    <i class="pi pi-bars text-lg"></i>
  </button>
</div>

<p-sidebar
  [(visible)]="showSidebar"
  [baseZIndex]="10000"
  position="left"
  [modal]="true"
  [closeOnEscape]="true"
  [showCloseIcon]="true"
  class="bg-white dark:bg-black transition-colors duration-300 shadow-lg rounded-r-3xl"
>
  <div
    class="cursor-pointer flex items-center gap-3 p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors duration-300"
    *ngFor="let item of menuItems"
    (click)="handleItemClick(item)"
  >
    <i *ngIf="item.icon" class="{{ item.icon }}"></i>
    <span class="font-medium text-gray-900 dark:text-gray-100">{{
      item.label
    }}</span>
  </div>
</p-sidebar>
